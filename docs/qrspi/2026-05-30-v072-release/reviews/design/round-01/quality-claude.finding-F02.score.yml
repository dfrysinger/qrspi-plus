reason: The finding correctly identifies that design.md, despite 2797 lines and 33 goals covering substantial v0.7.2 architecture (dispatch scripts, host×vendor matrix, tier system, verifier pipeline), contains only one sequenceDiagram focused on a single component flow (CD-4 verifier-fan-in). This violates the explicit design-quality check "System diagram present and readable — a Mermaid system diagram is present in design.md and describes the system at a level that helps an implementer understand component relationships" per qrspi-design-reviewer.md. The finding is structurally verified, the omission is real, and the proposed fix (top-level ~10-node component diagram early in the document) is reasonable and proportionate. The issue directly impacts design clarity and implementer orientation, which are load-bearing concerns at design phase.
