rationale: The finding correctly identifies that dispatch-agent.sh line 705 invokes dispatch-companion.sh with the literal token `launch` as $1, which causes immediate failure. The dispatch-companion.sh script (lines 562-579) detects launch-mode by scanning for the --vendor flag, then enters a while-loop that processes arguments as flags starting at line 572. When "launch" is passed as $1, it doesn't match any flag pattern (lines 574-578) and hits the default case at line 579: `die "launch: unrecognised flag: $1"`. The empirical context confirms: calling dispatch-companion.sh launch --vendor... fails with rc=1 and "dispatch-companion: launch: unrecognised flag: launch", while removing the launch token exits rc=0. The round-02 fix still contains this bug on line 705, causing all third-party reviewer dispatches in batched mode to fail immediately, directly violating task-20.md DoD bullet 3 (batched-mode third-party launch contract).
