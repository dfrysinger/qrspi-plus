reason: F02 correctly identifies a genuine test-coverage gap — the new positive tests invoke `dispatch-companion.sh --vendor ...` (flag-only) or `dispatch-agent.sh --agents` with first-party agents only, but never test the actual batched third-party dispatch path that dispatch-agent.sh uses (`launch --vendor ...`), which is broken per R2-F01. This means the tests cannot catch the production bug, violating task-20.md DoD line 59's requirement for "third-party split materialization" coverage. The finding's fix path (add an end-to-end batched third-party test) is valid and necessary.
