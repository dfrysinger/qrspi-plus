        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        name: Setup threat detection
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with: 
          script: |-
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/setup_threat_detection.cjs');
            await main();
      - if: always() && steps.detection_guard.outputs.run_detection == 'true'
        name: Ensure threat-detection directory and log
        run: |-
          mkdir -p /tmp/gh-aw/threat-detection
          touch /tmp/gh-aw/threat-detection/detection.log
      - continue-on-error: true
        env: 
          GH_AW_TOKEN_USAGE_SUMMARY_TITLE: Threat Detection Token Usage
        id: parse_detection_token_usage
        if: always()
        name: Parse threat detection token usage for step summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with: 
          script: |-
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/parse_token_usage.cjs');
            await main();
      - if: always() && steps.detection_guard.outputs.run_detection == 'true'
        name: Upload threat detection log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: 
          if-no-files-found: ignore
          name: detection
          path: /tmp/gh-aw/threat-detection/detection.log
      - continue-on-error: true
        env: 
          DETECTION_AGENTIC_EXECUTION_OUTCOME: ${{ steps.detection_agentic_execution.outcome }}
          GH_AW_DETECTION_CONTINUE_ON_ERROR: "true"
          RUN_DETECTION: ${{ steps.detection_guard.outputs.run_detection }}
        id: detection_conclusion
        if: always()
        name: Parse and conclude threat detection
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with: 
          script: |-
            try {
              const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
              setupGlobals(core, github, context, exec, io, getOctokit);
              const { main } = require('${{ runner.temp }}/gh-aw/actions/parse_threat_detection_results.cjs');
              await main();
            } catch (loadErr) {
              const continueOnError = process.env.GH_AW_DETECTION_CONTINUE_ON_ERROR !== 'false';
              const detectionExecutionFailed = process.env.DETECTION_AGENTIC_EXECUTION_OUTCOME === 'failure';
              const msg = 'ERR_SYSTEM: \u274C Unexpected error loading threat detection module: ' + (loadErr && loadErr.message ? loadErr.message : String(loadErr));
              core.error(msg);
              core.setOutput('reason', 'parse_error');
              if (continueOnError && !detectionExecutionFailed) {
                core.warning('\u26A0\uFE0F ' + msg);
                core.setOutput('conclusion', 'warning');
                core.setOutput('success', 'false');
              } else {
                core.setOutput('conclusion', 'failure');
                core.setOutput('success', 'false');
                core.setFailed(msg);
              }
            }
  safe_outputs:
    env:
      GH_AW_AGENT_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AMBIENT_CONTEXT: ${{ needs.agent.outputs.ambient_context }}
      GH_AW_CALLER_WORKFLOW_ID: ${{ github.repository }}/gaw-nexus-runner
      GH_AW_DETECTION_CONCLUSION: ${{ needs.detection.outputs.detection_conclusion }}
      GH_AW_DETECTION_REASON: ${{ needs.detection.outputs.detection_reason }}
      GH_AW_EFFECTIVE_TOKENS: ${{ needs.agent.outputs.effective_tokens }}
      GH_AW_ENGINE_ID: copilot
      GH_AW_ENGINE_MODEL: ${{ needs.agent.outputs.model }}
      GH_AW_ENGINE_VERSION: "1.0.65"
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_SAFE_OUTPUT_MESSAGES: "{\"activationComments\":\"false\"}"
      GH_AW_THREAT_DETECTION_AIC: ${{ needs.detection.outputs.aic }}
      GH_AW_WORKFLOW_ID: gaw-nexus-runner
      GH_AW_WORKFLOW_NAME: GAW Nexus Runner
    environment: gaw-safe-outputs
    if: (!cancelled()) && needs.agent.result != 'skipped' && needs.detection.result == 'success'
    needs:
      - activation
      - agent
      - detection
    outputs:
      code_push_failure_count: ${{ steps.process_safe_outputs.outputs.code_push_failure_count }}
      code_push_failure_errors: ${{ steps.process_safe_outputs.outputs.code_push_failure_errors }}
      create_discussion_error_count: ${{ steps.process_safe_outputs.outputs.create_discussion_error_count }}
      create_discussion_errors: ${{ steps.process_safe_outputs.outputs.create_discussion_errors }}
      created_pr_number: ${{ steps.process_safe_outputs.outputs.created_pr_number }}
      created_pr_url: ${{ steps.process_safe_outputs.outputs.created_pr_url }}
      process_safe_outputs_processed_count: ${{ steps.process_safe_outputs.outputs.processed_count }}
      process_safe_outputs_temporary_id_map: ${{ steps.process_safe_outputs.outputs.temporary_id_map }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-slim
    steps:
      - env: 
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/gaw-nexus-runner.lock.yml@${{ github.ref }}
          GH_AW_INFO_AWF_VERSION: v0.27.11
          GH_AW_INFO_ENGINE_ID: copilot
          GH_AW_INFO_VERSION: "1.0.65"
          GH_AW_SETUP_WORKFLOW_NAME: GAW Nexus Runner
        id: setup
        name: Setup Scripts
        uses: github/gh-aw-actions/setup@ba6380cc6e5be5d21677bebe04d52fb48e3abec7
        with: 
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
      - continue-on-error: true
        id: download-agent-output
        name: Download agent output artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: 
          name: agent
          path: /tmp/gh-aw/
      - id: setup-agent-output-env
        if: steps.download-agent-output.outcome == 'success'
        name: Setup agent output environment variable
        run: |-
          mkdir -p /tmp/gh-aw/
          find "/tmp/gh-aw/" -type f -print
          echo "GH_AW_AGENT_OUTPUT=/tmp/gh-aw/agent_output.json" >> "$GITHUB_OUTPUT"
      - continue-on-error: true
        name: Download patch artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: 
          name: agent
          path: /tmp/gh-aw/
      - if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request')
        name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: 
          persist-credentials: true
          token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request')
        name: Checkout target
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: 
          path: target
          persist-credentials: true
          token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request')
        name: Checkout embedded GAW bundle for gaw
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: 
          path: .gaw/nexus-engine-seed-gaw
          persist-credentials: false
          ref: refs/heads/gaw-nexus/engine/cbe6dbb912e7a6de261fb5af4ffac82089c87b70a958fd89e2dcdffbc2d64f39
          sparse-checkout: .gaw/nexus-engine/gaw-engine.bundle
          sparse-checkout-cone-mode: false
      - env: 
          GAW_ENGINE_BUNDLE_SHA256: cbe6dbb912e7a6de261fb5af4ffac82089c87b70a958fd89e2dcdffbc2d64f39
          GAW_ENGINE_DESTINATION: gaw
          GAW_ENGINE_REF: c55faba6e7ebf53cc93de56ff3cf0cab9786e704
          GAW_ENGINE_SEED_PATH: .gaw/nexus-engine-seed-gaw
        if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request')
        name: Verify and clone embedded GAW into gaw
        run: |-
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/$GAW_ENGINE_SEED_PATH/.gaw/nexus-engine/gaw-engine.bundle"
          actual_sha256="$(sha256sum "$bundle" | awk '{print $1}')"
          [ "$actual_sha256" = "$GAW_ENGINE_BUNDLE_SHA256" ] || { echo '::error::Embedded GAW bundle digest mismatch'; exit 1; }
          rm -rf "$GITHUB_WORKSPACE/$GAW_ENGINE_DESTINATION"
          git -c core.hooksPath=/dev/null clone --no-checkout "$bundle" "$GITHUB_WORKSPACE/$GAW_ENGINE_DESTINATION"
          git -C "$GITHUB_WORKSPACE/$GAW_ENGINE_DESTINATION" config core.hooksPath /dev/null
          git -C "$GITHUB_WORKSPACE/$GAW_ENGINE_DESTINATION" checkout --detach "$GAW_ENGINE_REF"
          [ "$(git -C "$GITHUB_WORKSPACE/$GAW_ENGINE_DESTINATION" rev-parse HEAD)" = "$GAW_ENGINE_REF" ] || { echo '::error::Embedded GAW revision mismatch'; exit 1; }
          rm -rf "$GITHUB_WORKSPACE/$GAW_ENGINE_SEED_PATH"
      - env: 
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GIT_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request')
        name: Configure Git credentials
        run: |-
          bash "${RUNNER_TEMP}/gh-aw/actions/configure_git_credentials.sh"
          # Re-authenticate git for gaw
          echo "Git configured with standard GitHub Actions identity"
      - id: ghes-host-config
        name: Configure GH_HOST for enterprise compatibility
        run: |-
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
        shell: bash
      - id: approval-token
        if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request')
        name: Mint read-only workflow-approval token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with: 
          app-id: ${{ vars.GAW_APPROVAL_APP_ID }}
          owner: ${{ github.repository_owner }}
          permission-actions: read
          private-key: ${{ secrets.GAW_APPROVAL_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request')
        name: Checkout embedded GAW bundle for gaw-write-gate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: 
          path: .gaw/nexus-engine-seed-gaw-write-gate
          persist-credentials: false
          ref: refs/heads/gaw-nexus/engine/cbe6dbb912e7a6de261fb5af4ffac82089c87b70a958fd89e2dcdffbc2d64f39
          sparse-checkout: .gaw/nexus-engine/gaw-engine.bundle
          sparse-checkout-cone-mode: false
      - env: 
          GAW_ENGINE_BUNDLE_SHA256: cbe6dbb912e7a6de261fb5af4ffac82089c87b70a958fd89e2dcdffbc2d64f39
          GAW_ENGINE_DESTINATION: gaw-write-gate
          GAW_ENGINE_REF: c55faba6e7ebf53cc93de56ff3cf0cab9786e704
          GAW_ENGINE_SEED_PATH: .gaw/nexus-engine-seed-gaw-write-gate
        if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request')
        name: Verify and clone embedded GAW into gaw-write-gate
        run: |-
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/$GAW_ENGINE_SEED_PATH/.gaw/nexus-engine/gaw-engine.bundle"
          actual_sha256="$(sha256sum "$bundle" | awk '{print $1}')"
          [ "$actual_sha256" = "$GAW_ENGINE_BUNDLE_SHA256" ] || { echo '::error::Embedded GAW bundle digest mismatch'; exit 1; }
          rm -rf "$GITHUB_WORKSPACE/$GAW_ENGINE_DESTINATION"
          git -c core.hooksPath=/dev/null clone --no-checkout "$bundle" "$GITHUB_WORKSPACE/$GAW_ENGINE_DESTINATION"
          git -C "$GITHUB_WORKSPACE/$GAW_ENGINE_DESTINATION" config core.hooksPath /dev/null
          git -C "$GITHUB_WORKSPACE/$GAW_ENGINE_DESTINATION" checkout --detach "$GAW_ENGINE_REF"
          [ "$(git -C "$GITHUB_WORKSPACE/$GAW_ENGINE_DESTINATION" rev-parse HEAD)" = "$GAW_ENGINE_REF" ] || { echo '::error::Embedded GAW revision mismatch'; exit 1; }
          rm -rf "$GITHUB_WORKSPACE/$GAW_ENGINE_SEED_PATH"
      - env: 
          ENTERPRISE_POLICY_B64: ${{ vars.GAW_ENTERPRISE_POLICY_B64 }}
          GAW_LIVE_EVIDENCE_DIR: /tmp/gh-aw/gaw-safe-outputs
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          POLICY_B64: ${{ inputs.policy_b64 }}
          RUN_TAG: ${{ inputs.run_tag }}
        if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request')
        name: Re-verify exact proposal for audit binding
        run: |-
          set -euo pipefail
          python3 -m venv /tmp/gaw-write-venv
          /tmp/gaw-write-venv/bin/python -m pip install --disable-pip-version-check -r "$GITHUB_WORKSPACE/gaw-write-gate/requirements.txt"
          PYTHONPATH="$GITHUB_WORKSPACE/gaw-write-gate" \
            /tmp/gaw-write-venv/bin/python -m src.safe_outputs.live detect \
              --agent-output "$GH_AW_AGENT_OUTPUT"
      - env: 
          ENTERPRISE_POLICY_B64: ${{ vars.GAW_ENTERPRISE_POLICY_B64 }}
          GAW_APPROVALS_TOKEN: ${{ steps.approval-token.outputs.token }}
          GAW_LIVE_EVIDENCE_DIR: /tmp/gh-aw/gaw-safe-outputs
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_TOKEN: ${{ github.token }}
          POLICY_B64: ${{ inputs.policy_b64 }}
          RUN_TAG: ${{ inputs.run_tag }}
        if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request')
        name: Bind environment approval and retry state
        run: |-
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/gaw-write-gate" \
            /tmp/gaw-write-venv/bin/python -m src.safe_outputs.live authorize-write \
              --agent-output "$GH_AW_AGENT_OUTPUT" \
              --environment gaw-safe-outputs
      - env: 
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_ALLOWED_DOMAINS: "*.services.ai.azure.com,api.business.githubcopilot.com,api.enterprise.githubcopilot.com,api.github.com,api.githubcopilot.com,api.individual.githubcopilot.com,github.com,github.ghe.com,host.docker.internal,login.microsoftonline.com,management.azure.com,raw.githubusercontent.com,registry.npmjs.org,telemetry.enterprise.githubcopilot.com"
          GH_AW_CI_TRIGGER_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN }}
          GH_AW_COMMENT_ID: ${{ needs.activation.outputs.comment_id }}
          GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG: "{\"create_pull_request\":{\"draft\":true,\"fallback_as_issue\":false,\"max\":1,\"max_patch_files\":100,\"max_patch_size\":4096,\"preserve_branch_name\":true,\"protect_top_level_dot_folders\":true,\"protected_files\":[\"package.json\",\"bun.lockb\",\"bunfig.toml\",\"deno.json\",\"deno.jsonc\",\"deno.lock\",\"global.json\",\"NuGet.Config\",\"Directory.Packages.props\",\"mix.exs\",\"mix.lock\",\"go.mod\",\"go.sum\",\"stack.yaml\",\"stack.yaml.lock\",\"pom.xml\",\"build.gradle\",\"build.gradle.kts\",\"settings.gradle\",\"settings.gradle.kts\",\"gradle.properties\",\"package-lock.json\",\"yarn.lock\",\"pnpm-lock.yaml\",\"npm-shrinkwrap.json\",\"requirements.txt\",\"Pipfile\",\"Pipfile.lock\",\"pyproject.toml\",\"setup.py\",\"setup.cfg\",\"Gemfile\",\"Gemfile.lock\",\"uv.lock\",\"CODEOWNERS\",\"DESIGN.md\",\"README.md\",\"CONTRIBUTING.md\",\"CHANGELOG.md\",\"SECURITY.md\",\"CODE_OF_CONDUCT.md\",\"AGENTS.md\",\"CLAUDE.md\",\"GEMINI.md\"],\"protected_files_policy\":\"request_review\"},\"missing_data\":{},\"missing_tool\":{},\"noop\":{\"max\":1,\"report-as-issue\":\"false\"}}"
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        id: process_safe_outputs
        name: Process Safe Outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with: 
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |-
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/safe_output_handler_manager.cjs');
            await main();
      - env: 
          CREATED_PR_NUMBER: ${{ steps.process_safe_outputs.outputs.created_pr_number }}
          CREATED_PR_URL: ${{ steps.process_safe_outputs.outputs.created_pr_url }}
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_TOKEN: ${{ github.token }}
        if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request')
        name: Finalize GAW SafeOutputs audit
        run: |-
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/gaw-write-gate" \
            /tmp/gaw-write-venv/bin/python -m src.safe_outputs.live finalize-audit \
              --agent-output "$GH_AW_AGENT_OUTPUT" \
              --detection-evidence /tmp/gh-aw/gaw-safe-outputs/gaw-detection.json \
              --authorization-evidence /tmp/gh-aw/gaw-safe-outputs/write-gate.json \
              --created-pr-number "$CREATED_PR_NUMBER" \
              --created-pr-url "$CREATED_PR_URL" \
              --output-dir /tmp/gh-aw/gaw-safe-outputs-audit
      - if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request')
        name: Mint proof-root-bound OIDC attestation
        run: |-
          set -euo pipefail
          /tmp/gaw-write-venv/bin/python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          root = pathlib.Path("/tmp/gh-aw/gaw-safe-outputs-audit")
          audit = json.loads((root / "audit.json").read_text())
          audience = f"gaw-safe-outputs:{audit['proofRoot']}"
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in url else "?"
          request = urllib.request.Request(
              url + separator + urllib.parse.urlencode({"audience": audience}),
              headers={
                  "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response).get("value")
          if not isinstance(token, str) or not token:
              raise SystemExit("GitHub OIDC endpoint returned an empty token")
          pathlib.Path("/tmp/gaw-safe-outputs-oidc.jwt").write_text(token + "\n")
          PY
      - if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request')
        name: Seal GAW SafeOutputs audit
        run: |-
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/gaw-write-gate" \
            /tmp/gaw-write-venv/bin/python -m src.safe_outputs.live seal-audit \
              --audit /tmp/gh-aw/gaw-safe-outputs-audit/audit.json \
              --token /tmp/gaw-safe-outputs-oidc.jwt \
              --output-dir /tmp/gh-aw/gaw-safe-outputs-audit
      - if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request')
        name: Upload GAW SafeOutputs audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: 
          if-no-files-found: error
          name: gaw-safe-outputs-audit
          path: /tmp/gh-aw/gaw-safe-outputs-audit/
      - if: always()
        name: Upload Safe Outputs Items
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: 
          if-no-files-found: ignore
          name: safe-outputs-items
          path: |-
            /tmp/gh-aw/safe-output-items.jsonl
            /tmp/gh-aw/temporary-id-map.json
    timeout-minutes: 45
name: GAW Nexus Runner
on:
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: Agent caller context (used internally by Agentic Workflows).
        required: false
        type: string
      executor:
        default: mock
        description: mock, sdk, or foundry
        required: false
        type: string
      live_relay_url:
        default: ""
        description: Optional cloud live-event relay base URL
        required: false
        type: string
      live_stream_id:
        default: ""
        description: Optional cloud live-event relay stream ID
        required: false
        type: string
      ows_body_b64:
        description: Base64 of the raw OWS workflow body, or of a versioned bundle-v1 source bundle
        required: true
        type: string
      ows_body_encoding:
        default: raw
        description: OWS payload encoding, raw, gzip, or bundle-v1 (versioned root plus trusted child-source catalog)
        required: false
        type: string
      policy_b64:
        description: Base64 JSON author and run policy parameters
        required: true
        type: string
      run_input_b64:
        default: ""
        description: Optional base64 Contract-2 run-input envelope
        required: false
        type: string
      run_tag:
        description: Stable logical invocation UUID used for correlation and retry serialization
        required: true
        type: string
permissions: {}
run-name: gaw-nexus ${{ inputs.run_tag }}