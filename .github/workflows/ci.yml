name: CI

on:
  push:
    branches:
      - main
      - 'qrspi/**'
      - '*/issue-*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (shellcheck + bash32 ban-list)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        # --severity=error: surface parse/syntax errors and undefined-function bugs
        # only. The bash-3.2-portability constraint we enforce elsewhere (see
        # ban-list step below) generates false-positive shellcheck warnings:
        # SC2206 suggests `mapfile`/`read -a` (both bash-4+, banned in this repo),
        # and SC2016 flags single-quoted `$VAR` strings in printf/diagnostic
        # messages where literal `$VAR` is intentional. Keep warnings visible in
        # logs but non-blocking; the ban-list job is the real bash-3.2 backstop.
        run: |
          find hooks scripts tests/helpers \
            \( -name '*.sh' -o -name '*.bash' \) \
            -print0 \
          | xargs -0 shellcheck --shell=bash --severity=error

      - name: Option B ban-list grep (bash 4+ constructs)
        run: |
          set +e
          hits=$(find hooks scripts tests/helpers \
            \( -name '*.sh' -o -name '*.bash' \) \
            -print0 \
          | xargs -0 grep -En \
              -e '\bmapfile\b' \
              -e '\bdeclare -A\b' \
              -e '\$\{[^}]*,,\}' \
              -e '\$\{[^}]*\^\^\}' \
              -e '\bcoproc\b' \
              -e '\bwait -n\b' \
          2>/dev/null)
          if [ -n "$hits" ]; then
            echo "ban-list: bash 4+ constructs detected (bash 3.2 portability violation):"
            echo "$hits"
            exit 1
          fi
          echo "ban-list: clean"

  bash32:
    name: BATS under bash 3.2
    runs-on: ubuntu-latest
    container:
      # bash:3.2 tag (unpinned). The previous sha256:3ecad660... pin was wrong
      # at land time — the manifest never existed on Docker Hub, so every CI
      # run hit "manifest unknown". Unpinning to the tag lets the job run; a
      # follow-up issue tracks re-pinning to a current SHA once one is verified.
      image: bash:3.2
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install runtime dependencies
        run: |
          apk add --no-cache \
            bash \
            bats \
            jq \
            yq \
            coreutils \
            grep \
            findutils

      - name: Run unit BATS suite
        run: bats --tap tests/unit/

      - name: Run acceptance BATS suite
        run: bats --tap tests/acceptance/
